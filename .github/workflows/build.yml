name: Compilar Klaus (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true

      - name: Palavra de ativação "Klaus" (tokens BPE)
        run: |
          pip install sentencepiece || true
          python3 tools/make_keywords.py || echo "::warning::Mantido keywords.txt manual"

      - name: Dependências
        run: flutter pub get

      - name: Corrigir plugin flutter_pcm_player (namespace)
        run: |
          D="$HOME/.pub-cache/hosted/pub.dev/flutter_pcm_player-0.0.1/android"
          if [ -f "$D/build.gradle" ] && ! grep -q namespace "$D/build.gradle"; then
            sed -i '/android {/a \    namespace "com.example.flutter_pcm_player"' "$D/build.gradle"
          fi
          cat "$D/build.gradle" || true

      - name: Análise do código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KLAUS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/klaus.jks
            echo "Assinatura fixa ativada."
          else
            echo "::warning::Segredo KLAUS_KEYSTORE_B64 em falta: APK assinado com chave de teste (atualizações por cima não vão instalar)."
          fi

      - name: Compilar APK
        env:
          KLAUS_STORE_PASSWORD: ${{ secrets.KLAUS_STORE_PASSWORD }}
          KLAUS_KEY_PASSWORD: ${{ secrets.KLAUS_STORE_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}
          mkdir -p out
          ls -la build/app/outputs/flutter-apk/
          # APK principal: telemóveis modernos (arm64). O "antigo" é para aparelhos de 32 bits.
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/Klaus-${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/Klaus-${{ github.run_number }}-antigo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Klaus-${{ github.run_number }}
          path: out/*.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Klaus versão ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk
          make_latest: true
