name: klaus
description: "Klaus - robozinho de conversa por voz ligado ao XiaoZhi."
publish_to: 'none'

# O número depois do + é substituído pelo CI (número da compilação).
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.2
  http: ^1.3.0
  web_socket_channel: ^3.0.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  opus_dart: ^3.0.1
  opus_flutter: ^3.0.3
  record: ^5.2.1
  permission_handler: ^11.4.0
  audio_session: ^0.1.25
  flutter_pcm_player: ^0.0.1
  url_launcher: ^6.3.0
  wakelock_plus: ^1.2.8
  path_provider: ^2.1.5
  sherpa_onnx: ^2.0.2
  tflite_flutter: ^0.11.0
  ffi: ^2.1.0
  just_audio: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/emojis/
    - assets/kws/
    - assets/wakeword/

# Versões do gravador que sabemos que funcionam juntas (as mais novas quebram o record_linux).
dependency_overrides:
  record_platform_interface: 1.2.0
  record_android: 1.3.1
  record_linux: 0.7.2
